name: Enforce Label for develop → main PR

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]
    branches:
      - main

jobs:
  validate-label:
    if: |
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check for required label
        uses: actions/github-script@v7
        with:
          script: |
            const allowedLabels = ['major', 'minor', 'patch'];
            const prLabels = context.payload.pull_request.labels.map(label => label.name);

            const matchingLabels = prLabels.filter(label => allowedLabels.includes(label));

            if (matchingLabels.length !== 1) {
              core.setFailed(
                `❌ This PR is from develop → main and must have exactly ONE label: ${allowedLabels.join(', ')}. Found: ${matchingLabels.join(', ') || 'none'}`
              );
            } else {
              console.log(`✅ Valid label found: ${matchingLabels[0]}`);
            }
